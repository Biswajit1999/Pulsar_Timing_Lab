name: Pulsar scientific diagnostics
on:
  push:
    branches: ['research/**']
  pull_request:
    paths: ['tools/**', 'tests/**', 'docs/timing_robustness.md', '.github/workflows/timing-diagnostics.yml']
jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_observations.py
      - run: python tools/run_timing_robustness.py --output outputs/timing_robustness.json
      - uses: actions/upload-artifact@v4
        with:
          name: nanograv-descriptive-diagnostics
          path: outputs/timing_robustness.json

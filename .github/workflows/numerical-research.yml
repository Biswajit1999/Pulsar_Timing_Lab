name: Independent numerical research tests
on:
  push:
    branches:
      - research/2026-11-05-numerical-robustness
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/numerical-research.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: cd research && python -m unittest discover -v -p 'test_*robustness.py'
